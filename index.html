<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      GitHub Pages serves no custom response headers, so vercel.json and
      public/_headers are both inert on this deployment. What is left is what
      can be expressed in markup, which is this tag and the referrer one below.

      Must stay near the top of <head>: a meta CSP only governs what the parser
      encounters after it, so anything above this line is unprotected.

      Not expressible here, and therefore genuinely lost relative to a
      header-capable host:
        - frame-ancestors / X-Frame-Options. The directive is explicitly
          ignored in a meta tag, so clickjacking protection is gone. The site
          holds no session and takes no authenticated action, which is the only
          reason that is tolerable.
        - Permissions-Policy. No meta equivalent exists.
        - Strict-Transport-Security. Not needed here in practice: github.io is
          on the browsers' HSTS preload list, so HTTPS is already forced for
          this origin. It becomes a real gap if the site moves to a custom
          domain, where it would have to be set at the host.

      script-src and style-src allow 'unsafe-inline' deliberately. index.html
      carries an inline pre-paint theme script and a build-generated JSON-LD
      block, and Framer Motion animates through inline style attributes, which
      style-src governs. A hash allowlist would fail silently and visibly — a
      theme flash on load, or every animation dead — the next time either
      inline block is edited. The tradeoff is acceptable specifically because
      this site renders no untrusted input: no dangerouslySetInnerHTML, no
      user-generated content, no query parameters reaching the DOM, no
      authenticated state worth stealing. Revisit if any of that changes.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <!-- Full URL within the site, origin-only when leaving, nothing on downgrade. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- iOS ignores SVG here; it needs a real raster icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking the first paint. A plain stylesheet link to a
      third-party origin sits on the critical path: the browser will not render
      anything until fonts.googleapis.com answers, so a slow or blocked font
      host delays the whole page rather than just the typography.

      media="print" makes the browser fetch the sheet at low priority without
      applying it; the onload handler flips it to "all" once it has arrived.
      display=swap in the URL already guarantees text paints in a fallback face
      meanwhile, so nothing is invisible while this resolves. The <noscript>
      copy covers the case where the onload never runs.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Generated at build time from src/data/services.js — see vite.config.js. -->
    <!--structured-data-->

    <script>
      // Applied before paint to prevent a theme flash.
      (function () {
        try {
          // Dark-first: the system preference never overrides the default,
          // only an explicit choice from the toggle does.
          var stored = localStorage.getItem('nk-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
